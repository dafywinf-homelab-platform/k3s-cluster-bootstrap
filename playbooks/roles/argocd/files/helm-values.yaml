---
global:
  domain: argocd.192.168.86.10.sslip.io

configs:
  params:
    # TLS is terminated by Traefik (default certificate); argocd-server serves plain HTTP behind it
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    tls: false

# No SSO - local admin account only
dex:
  enabled: false
