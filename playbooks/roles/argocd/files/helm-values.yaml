---
global:
  domain: argocd.192.168.86.10.sslip.io

configs:
  params:
    # TLS is terminated by Traefik (default certificate); argocd-server serves plain HTTP behind it
    server.insecure: true
  cm:
    # Report a child Application's own health as its health (removed from the defaults in Argo CD 1.8), so the
    # sync waves on the app-of-apps in homelab-gitops wait for each platform group to be Healthy, not just created.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    tls: false

# No SSO - local admin account only
dex:
  enabled: false
