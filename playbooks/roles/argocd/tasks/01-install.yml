---
- name: Ensure Python Kubernetes library is installed
  ansible.builtin.pip:
    name: kubernetes
    executable: pip3
    extra_args: --break-system-packages
  become: true

- name: Add the argo-helm repository
  kubernetes.core.helm_repository:
    name: "{{ argocd_helm_repo_name }}"
    repo_url: "{{ argocd_helm_repo_url }}"

- name: Copy Argo CD values file to the target machine
  ansible.builtin.copy:
    src: "{{ argocd_helm_values_file }}"
    dest: /tmp/argocd_values.yaml
    mode: '0644'

- name: Install Argo CD via Helm
  kubernetes.core.helm:
    name: "{{ argocd_release_name }}"
    chart_ref: "{{ argocd_helm_repo_name }}/{{ argocd_chart_name }}"
    chart_version: "{{ argocd_chart_version }}"
    namespace: "{{ argocd_namespace }}"
    create_namespace: true
    release_state: present
    update_repo_cache: true
    wait: true
    kubeconfig: "{{ argocd_kubeconfig }}"
    values_files:
      - /tmp/argocd_values.yaml

- name: Clean up Argo CD values file
  ansible.builtin.file:
    path: /tmp/argocd_values.yaml
    state: absent
