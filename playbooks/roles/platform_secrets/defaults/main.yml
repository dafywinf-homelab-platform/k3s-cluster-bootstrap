---
# Kubernetes Secrets that Argo CD-managed apps reference but that must never be in Git.
# Values come from the git-ignored secrets.yml at the repo root.
# Being retired: new secrets are SealedSecrets in homelab-gitops (`make seal`), delivered by Argo CD, not Ansible.
# Jenkins moved 2026-11-21; Grafana is the last one here (homelab-architecture ADR-010).
platform_secrets_kubeconfig: "{{ ansible_user_dir }}/.kube/config"

# Grafana admin login, referenced by kube-monitoring-chart (grafana.admin.existingSecret)
grafana_admin_namespace: kube-monitoring
grafana_admin_secret_name: grafana-admin
grafana_admin_user: admin
grafana_admin_password: ""
