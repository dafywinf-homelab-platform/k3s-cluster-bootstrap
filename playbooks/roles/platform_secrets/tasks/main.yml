---
- name: Require a Grafana admin password
  ansible.builtin.assert:
    that: grafana_admin_password | length >= 16
    fail_msg: "Set grafana_admin_password (16+ characters) in secrets.yml"
    quiet: true

- name: Ensure the {{ grafana_admin_namespace }} namespace exists
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ platform_secrets_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ grafana_admin_namespace }}"

- name: Create the Grafana admin Secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ platform_secrets_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ grafana_admin_secret_name }}"
        namespace: "{{ grafana_admin_namespace }}"
      stringData:
        admin-user: "{{ grafana_admin_user }}"
        admin-password: "{{ grafana_admin_password }}"
  no_log: true
