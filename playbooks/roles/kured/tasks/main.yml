---
- name: Add the kubereboot Helm repository
  kubernetes.core.helm_repository:
    name: "{{ kured_helm_repo_name }}"
    repo_url: "{{ kured_helm_repo_url }}"

- name: Copy Kured values file to the target machine
  ansible.builtin.copy:
    src: "{{ kured_helm_values_file }}"
    dest: /tmp/kured_values.yaml
    mode: '0644'

- name: Install Kured via Helm
  kubernetes.core.helm:
    name: "{{ kured_release_name }}"
    chart_ref: "{{ kured_helm_repo_name }}/{{ kured_chart_name }}"
    chart_version: "{{ kured_chart_version }}"
    namespace: "{{ kured_namespace }}"
    release_state: present
    update_repo_cache: true
    wait: true
    kubeconfig: "{{ kured_kubeconfig }}"
    values_files:
      - /tmp/kured_values.yaml

- name: Clean up Kured values file
  ansible.builtin.file:
    path: /tmp/kured_values.yaml
    state: absent
