---
# Installs system-upgrade-controller and points its Plans at k3s_version (group_vars).
# For a multi-minor upgrade run once per minor, e.g. -e k3s_version=v1.31.14+k3s1, waiting for every node to report
# the new version before the next run (see roles/system_upgrade_controller/defaults/main.yml).
- name: Upgrade k3s with system-upgrade-controller
  hosts: k3s_master-1
  roles:
    - system_upgrade_controller
